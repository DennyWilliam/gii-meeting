<style>

.dash-hdr{padding:9px 12px;border-bottom:1px solid #f5f5f5;display:flex;align-items:center;justify-content:space-between;}
.dash-pb{padding:7px 12px 0;}
.dash-pb-row{display:flex;justify-content:space-between;margin-bottom:3px;}

.dash-sec{margin-bottom:6px;}

.danger-zone{margin-top:20px;border-top:1px solid #f0f0f0;padding-top:18px;}
.reset-btn{background:#fff;border:1px solid #fca5a5;color:#ef4444;border-radius:7px;padding:6px 13px;font-size:12px;}
.pdf-panel{background:#fff;border:1px solid #f0f0f0;border-radius:9px;padding:13px 16px;margin-bottom:13px;}

@keyframes fadeUp{from{opacity:0;transform:translateX(-50%) translateY(5px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
.sl-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px;}
.sl-k{background:#fff;border:1px solid #f0f0f0;border-radius:10px;padding:11px 14px;}

.sl-k b{font-size:16px;font-variant-numeric:tabular-nums;display:block;}
.sl-k i{font-style:normal;font-size:11px;color:#9ca3af;display:block;margin-top:2px;}
.sl-k.gp b{color:#059669;}.sl-k.ex b{color:#dc2626;}.sl-k.net b{color:#1d4ed8;}
.sl-tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
.sl-tabs button{font-size:12px;padding:5px 12px;border-radius:20px;border:1px solid #e5e7eb;background:#fff;color:#6b7280;}
.sl-tabs button.on{background:#1e293b;color:#fff;border-color:#1e293b;}
.sl-card{background:#fff;border:1px solid #f0f0f0;border-radius:10px;overflow:hidden;margin-bottom:14px;}

.sl-ch span{font-size:11px;color:#9ca3af;font-weight:400;}
.sl-sc{overflow-x:auto;}
.sl-t{width:100%;table-layout:fixed;border-collapse:collapse;font-size:12.5px;min-width:620px;}
.sl-t th{background:#fafbfc;color:#6b7280;font-weight:600;font-size:11px;text-align:right;padding:8px 12px;border-bottom:1px solid #f0f0f0;white-space:nowrap;}
.sl-t th.m,.sl-t td.m{text-align:left;}
.sl-t td{padding:6px 12px;border-bottom:1px solid #f7f7f7;}
.sl-t td.n{text-align:right;font-variant-numeric:tabular-nums;color:#374151;}
.sl-t td.m{font-weight:600;color:#111827;white-space:nowrap;width:150px;}
.sl-t td.tot{font-weight:700;background:#f8fafc;color:#111827;}
.sl-t td.gp{color:#059669;}.sl-t td.ex{color:#dc2626;}.sl-t td.net{color:#1d4ed8;font-weight:700;}.sl-t td.neg{color:#dc2626;font-weight:700;}
.sl-t td.dash{color:#d1d5db;}
.sl-t td.edit{cursor:cell;}

.sl-t tr.sum td{background:#1e293b;color:#f1f5f9;font-weight:700;border:none;}
.sl-t tr:not(.sum):not(.empty):hover td{background:#fafbff;}
.sl-pen{background:none;border:none;font-size:11px;opacity:0;padding:0 2px;}
.sl-t tr:hover .sl-pen{opacity:.7;}
.sl-cell{width:100%;min-width:70px;text-align:right;border:1px solid #6366f1;border-radius:5px;padding:3px 6px;font-size:12.5px;}
.pill{display:inline-block;min-width:52px;text-align:center;padding:1px 7px;border-radius:20px;font-size:11.5px;font-weight:600;}
.pill.hi{background:#d1fae5;color:#065f46;}.pill.mid{background:#fef3c7;color:#92400e;}.pill.lo{background:#fee2e2;color:#991b1b;}
.sl-form{background:#fff;border:1px solid #c7d2fe;border-radius:10px;padding:14px;margin-bottom:14px;}
.sl-fh{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;font-size:13px;}
.sl-hint{font-size:11px;color:#9ca3af;}
.sl-fg{display:grid;grid-template-columns:2fr 2fr 1fr;gap:16px;}
.sl-gt{font-size:11px;font-weight:700;color:#6b7280;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px;}
.sl-gr{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.sl-grp:last-child .sl-gr{grid-template-columns:1fr;}
.sl-fld{display:flex;flex-direction:column;gap:3px;font-size:11px;color:#6b7280;}
.sl-fld input{border:1px solid #e5e7eb;border-radius:6px;padding:7px 9px;font-size:13px;text-align:right;background:#fafafa;}
.sl-fld input:focus{border-color:#6366f1;background:#fff;}
.sl-err{color:#dc2626;font-size:12px;margin-top:10px;}
.sl-act{display:flex;gap:8px;margin-top:12px;}
.sl-btn{background:#1e293b;color:#fff;border:none;border-radius:7px;padding:7px 16px;font-size:13px;}
.sl-btn.ghost{background:#fff;color:#6b7280;border:1px solid #e5e7eb;}
.sl-warn{background:#fef3c7;color:#78350f;padding:14px 18px;font-size:13px;font-weight:600;border:1px solid #f59e0b;border-radius:8px;margin-bottom:12px;}
.sl-note{font-size:11.5px;color:#9ca3af;margin-bottom:20px;}
@media(max-width:800px){.sl-cards{grid-template-columns:repeat(2,1fr);}.sl-fg{grid-template-columns:1fr;}}
.sb-foot{padding:10px 12px 12px;border-top:1px solid rgba(255,255,255,0.07);}
.sb-bk-st{font-size:10.5px;color:#64748b;margin-bottom:7px;line-height:1.35;}
.sb-bk-st.warn{color:#fbbf24;}
.sb-bk-row{display:flex;gap:6px;}
.sb-bk-btn{flex:1;background:rgba(255,255,255,0.07);border:none;color:#cbd5e1;border-radius:6px;padding:6px 4px;font-size:11.5px;}
.sb-bk-btn:hover{background:rgba(255,255,255,0.14);}
</style>

<body>
<div id="app"></div>
<script>
const SK="gii_v6_data",MK="gii_v7_members";
const DEF_MEMBERS=["Shierly","Clara","Alfin","Eva","Robert","David","Finance"];
const MAX_UNDO=30;
const SECS=[
  {key:"targets",   label:"Target",    icon:"🎯",color:"#3b82f6"},
  {key:"progress",  label:"Progress",  icon:"🔄",color:"#f59e0b"},
  {key:"hasil",     label:"Result",     icon:"✅",color:"#10b981"},
  {key:"pengalaman",label:"Experience",icon:"💡",color:"#8b5cf6"},
];
const HAS_DONE=new Set(["targets","progress"]);

function getCurWeek(){const n=new Date(),dow=n.getDay(),d=new Date(n);d.setDate(n.getDate()-dow+(dow===0?-6:1));return d.toISOString().split("T")[0];}
function weekLabel(ds){const d=new Date(ds+"T00:00:00"),dow=d.getDay();const s=new Date(d);s.setDate(d.getDate()-dow+(dow===0?-6:1));const e=new Date(s);e.setDate(s.getDate()+6);const f=x=>x.toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"2-digit"});return`${f(s)} – ${f(e)}`;}
function fmtD(iso){if(!iso)return"";return new Date(iso).toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"numeric"});}
function fmtDT(iso){if(!iso)return"";const d=new Date(iso);return d.toLocaleDateString("id-ID",{day:"2-digit",month:"short",year:"numeric"})+" "+d.toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"});}
function newPt(text,ds){return{id:Date.now()+Math.random(),text,status:null,doneAt:null,incompleteAt:null,createdAt:ds?new Date(ds).toISOString():new Date().toISOString(),subs:[]};}
function newSub(t){return{id:Date.now()+Math.random(),text:t,createdAt:new Date().toISOString()};}
function emptyMd(){return Object.fromEntries([...SECS.map(s=>[s.key,[]]),["_editedAt",null],["_createdAt",null]]);}
function getMd(data,wk,mi){return data?.[wk]?.[mi]||emptyMd();}
function setMd(data,wk,mi,md){return{...data,[wk]:{...(data[wk]||{}),[mi]:md}};}
function autoResize(el){if(!el)return;el.style.height="auto";el.style.height=Math.max(22,el.scrollHeight)+"px";}
function td(){return new Date().toISOString().split("T")[0];}
function el(tag,attrs,children){
  const e=document.createElement(tag);
  if(attrs)Object.entries(attrs).forEach(([k,v])=>{
    if(k==="style"&&typeof v==="object")Object.assign(e.style,v);
    else if(k.startsWith("on"))e.addEventListener(k.slice(2).toLowerCase(),v);
    else if(k==="className")e.className=v;
    else e.setAttribute(k,v);
  });
  if(children!=null)(Array.isArray(children)?children:[children]).forEach(c=>{
    if(c==null||c===false)return;
    e.appendChild(typeof c==="string"?document.createTextNode(c):c);
  });
  return e;
}

async function rpc(fn,body){
  const r=await fetch(SB_URL+"/rest/v1/rpc/"+fn,{method:"POST",headers:{apikey:SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});
  const t=await r.text();
  if(!r.ok){let m=t;try{m=JSON.parse(t).message||t;}catch(e){}throw new Error(m);}
  return t?JSON.parse(t):null;
}
function countPoints(data){let n=0;for(const w of Object.keys(data||{}))for(const m of Object.keys(data[w]||{})){const r=data[w][m]||{};for(const k of["targets","progress","hasil","pengalaman"])if(Array.isArray(r[k]))n+=r[k].length;}return n;}

async function loadFromServer(silent=false){
  try{
    if(CLOUD){
      const tk=getToken();
      if(!tk){S.needLogin=true;S.loaded=false;return;}
      const d=await rpc("meeting_pull",{p_token:tk});
      if(d){S.data=(d.data&&countPoints(d.data)>0)?d.data:{};if(d.members&&d.members.length)S.members=d.members;S.base=d.updated_at;}
      S.loaded=true;S.needLogin=false;S.conflict=false;
      return;
    }
    const r=await fetch("/api/data");

  }catch(e){
    S.loaded=false;
    if(CLOUD&&/unauthorized/.test(e.message)){setToken("");S.needLogin=true;S.loginErr="Kata sandi salah.";return;}
    console.error("Gagal load data:",e);
  }
}

async function saveToServer(){
  // SAFETY: never save if initial load never succeeded — prevents wiping data with empty state
  if(!S.loaded){console.warn("Save diblokir: data belum berhasil dimuat.");return;}
  if(S.conflict){return;}
  try{

      const n=countPoints(S.data);
      if(n===0){return;} // never push empty state
      const res=await rpc("meeting_push2",{p_token:getToken(),p_data:S.data,p_members:S.members,p_count:n,p_base:S.base});
      S.base=res.updated_at;S.cloudErr="";
      setSaveInd("✓ Tersimpan online",true);

function getWeeks(){const k=Object.keys(S.data).sort((a,b)=>b.localeCompare(a));if(!k.includes(S.curWeek))k.unshift(S.curWeek);return k;}
function getPrev(){return getWeeks().filter(w=>w<S.curWeek)[0]||null;}
function getWeeksInRange(from,to){return getWeeks().filter(w=>{if(from&&w<from)return false;if(to&&w>to)return false;return true;});}
function mkSel(val,opts,onChange,extra={}){

function buildPt(pt,realIdx,secKey,color,wk,mi,onChange){
  const hasDone=HAS_DONE.has(secKey);
  const isDone=pt.status==="done",isInc=pt.status==="incomplete";
  const expKey=`${wk}-${mi}-${secKey}-${pt.id}`;
  const isExp=!!S.expandedSubs[expKey];
  const isAdding=!!S.addingSubFor[expKey];
  const isEditing=!!S.editingPt[expKey];

  const nc=isDone?"#10b981":isInc?"#ef4444":color;
  const tc=isDone?"#059669":isInc?"#dc2626":"#111827";

  const div=el("div",{className:`pt${isDone?" done":isInc?" inc":""}`});
  const main=el("div",{className:"pt-main"});
  const num=el("span",{className:"pt-num"},String(realIdx+1));
  num.style.cssText=`background:${nc}18;color:${nc};`;

  // BUG2 FIX: show editable textarea only in edit mode, otherwise plain text
  let textEl;
  if(isEditing){
    const ta=el("textarea",{className:"pt-ta"});
    ta.value=S.editingPtText[expKey]??pt.text;ta.rows=1;ta.style.color=tc;
    ta.style.border="1.5px solid "+color;ta.style.borderRadius="5px";ta.style.padding="2px 5px";ta.style.background="#fafafa";
    ta.oninput=e=>{autoResize(e.target);S.editingPtText[expKey]=e.target.value;};
    ta.onfocus=e=>autoResize(e.target);
    setTimeout(()=>{autoResize(ta);ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);},0);
    ta.onkeydown=e=>{
      if(e.key==="Escape"){S.editingPt[expKey]=false;delete S.editingPtText[expKey];render();}
    };
    textEl=ta;
  } else {
    const span=el("div",{className:"pt-ta"});
    span.style.color=tc;span.style.cursor="default";span.style.userSelect="text";
    span.style.whiteSpace="pre-wrap";span.style.wordBreak="break-word";
    span.textContent=pt.text;
    textEl=span;
  }

  const acts=el("div",{className:"pt-acts"});

  // Edit / Save button (Bug 2)
  if(isEditing){
    const saveB=el("button",{className:"abt",onclick:()=>{
      const newText=(S.editingPtText[expKey]??pt.text).trim();
      S.editingPt[expKey]=false;delete S.editingPtText[expKey];
      if(newText!==pt.text)onChange({...pt,text:newText});
      else render();
    }});
    saveB.style.cssText="background:#1e293b;border-color:#1e293b;color:#fff;font-weight:600;border-radius:5px;padding:2px 7px;font-size:11px;border:1px solid;";
    saveB.textContent="✓ Simpan";
    const cancB=el("button",{className:"abt",onclick:()=>{S.editingPt[expKey]=false;delete S.editingPtText[expKey];render();}});
    cancB.textContent="Batal";
    acts.append(saveB,cancB);
  } else {
    const editB=el("button",{className:"abt",onclick:()=>{S.editingPt[expKey]=true;S.editingPtText[expKey]=pt.text;render();}});
    editB.textContent="✏️";editB.title="Edit poin";
    acts.appendChild(editB);
    // Sub badge, Update, Done/Inc, Del — only in non-edit mode
    if(pt.subs&&pt.subs.length){
      const sb=el("button",{className:"sub-badge"+(isExp?" open":""),onclick:()=>{S.expandedSubs[expKey]=!isExp;render();}});
      sb.textContent=String(pt.subs.length);sb.title=(isExp?"Sembunyikan":"Lihat")+" update";
      acts.appendChild(sb);
    }
    const ub=el("button",{className:"abt upd",onclick:()=>{S.addingSubFor[expKey]=!isAdding;if(!S.addSubText[expKey])S.addSubText[expKey]="";render();}});
    ub.textContent="+ Update";acts.appendChild(ub);
    if(hasDone){
      const db=el("button",{className:"abt"+(isDone?" done-on":""),onclick:()=>{const ns=isDone?null:"done";onChange({...pt,status:ns,doneAt:ns==="done"?new Date().toISOString():null,incompleteAt:null});}});
      db.textContent=isDone?"✓ Done":"Done";
      const ib=el("button",{className:"abt"+(isInc?" inc-on":""),onclick:()=>{const ns=isInc?null:"incomplete";onChange({...pt,status:ns,incompleteAt:ns==="incomplete"?new Date().toISOString():null,doneAt:null});}});
      ib.textContent=isInc?"✗ Inc":"Inc";
      acts.append(db,ib);
    }
    const del=el("button",{className:"abt del",onclick:()=>onChange(null)});del.textContent="×";acts.appendChild(del);
  }

  main.append(num,textEl,acts);div.appendChild(main);

  // Meta row — date removed (shown as group header instead), keep done/inc status
  if((isDone&&pt.doneAt)||(isInc&&pt.incompleteAt)){
    const meta=el("div",{className:"pt-meta"});
    if(isDone&&pt.doneAt)meta.appendChild(el("span",{className:"done-ts"},"✓ "+fmtDT(pt.doneAt)));
    if(isInc&&pt.incompleteAt)meta.appendChild(el("span",{className:"inc-ts"},"✗ "+fmtDT(pt.incompleteAt)));
    div.appendChild(meta);
  }

  // Sub list (expanded only — no preview when collapsed)
  if(isExp&&pt.subs&&pt.subs.length){
    const sl=el("div",{className:"sub-list"});
    sl.style.borderLeftColor=color+"40";
    pt.subs.forEach((sub,si)=>{
      const row=el("div",{className:"sub-row"});
      const dot=el("span",{className:"sub-dot"});dot.style.background=color+"60";
      const inner=el("div",{style:{flex:1}});
      const subEditKey=expKey+"-sub-"+si;
      const isEditingSub=!!S.editingPt[subEditKey];
      inner.appendChild(el("div",{className:"sub-date"},fmtD(sub.createdAt)));
      if(isEditingSub){
        const sta=el("textarea",{className:"sub-ta"});sta.rows=1;
        sta.value=S.editingPtText[subEditKey]??sub.text;
        sta.style.borderColor=color;
        sta.oninput=e=>{autoResize(e.target);S.editingPtText[subEditKey]=e.target.value;};
        sta.onfocus=e=>{autoResize(e.target);};
        setTimeout(()=>{autoResize(sta);sta.focus();},0);
        sta.onkeydown=e=>{if(e.key==="Escape"){S.editingPt[subEditKey]=false;delete S.editingPtText[subEditKey];render();}};
        inner.appendChild(sta);
        const sActs=el("div",{style:{display:"flex",gap:"4px",marginTop:"4px"}});
        const sv=el("button",{className:"btn-p",onclick:()=>{
          const val=(S.editingPtText[subEditKey]??sub.text).trim();
          S.editingPt[subEditKey]=false;delete S.editingPtText[subEditKey];
          const ns=[...pt.subs];ns[si]={...sub,text:val};onChange({...pt,subs:ns});
        }});sv.textContent="✓ Simpan";
        const cn=el("button",{className:"btn-c",onclick:()=>{S.editingPt[subEditKey]=false;delete S.editingPtText[subEditKey];render();}});cn.textContent="Batal";
        sActs.append(sv,cn);inner.appendChild(sActs);
      } else {
        const stxt=el("div",{style:{fontSize:"12px",color:"#374151",lineHeight:"1.4",padding:"2px 0",cursor:"default",userSelect:"text",whiteSpace:"pre-wrap",wordBreak:"break-word"}});
        stxt.textContent=sub.text;inner.appendChild(stxt);
      }
      const subActions=el("div",{style:{display:"flex",gap:"3px",flexShrink:0,marginTop:"2px"}});
      if(!isEditingSub){
        const seB=el("button",{className:"sub-del",style:{fontSize:"11px",color:"#9ca3af"},onclick:()=>{S.editingPt[subEditKey]=true;S.editingPtText[subEditKey]=sub.text;render();}});seB.textContent="✏️";
        const sd=el("button",{className:"sub-del",onclick:()=>{const ns=pt.subs.filter((_,j)=>j!==si);onChange({...pt,subs:ns});}});sd.textContent="×";
        subActions.append(seB,sd);
      }
      row.append(el("div",{style:{flexShrink:0,marginTop:"4px"}},dot),inner,subActions);
      sl.appendChild(row);
    });
    div.appendChild(sl);
  }

  // Add sub input
  // BUG3 FIX: close properly after saving, don't leave open
  if(isAdding){
    const box=el("div",{className:"add-sub-box"});
    box.style.borderColor=color+"40";
    box.appendChild(el("div",{style:{fontSize:"9px",color:"#9ca3af",fontFamily:"monospace",marginBottom:"4px"}},"📅 "+fmtD(new Date().toISOString())));
    const ta2=el("textarea",{className:"add-sub-ta"});
    ta2.style.borderColor=color;ta2.placeholder="Tulis Update...";ta2.rows=2;
    ta2.value=S.addSubText[expKey]||"";
    ta2.oninput=e=>S.addSubText[expKey]=e.target.value;
    const doSub=()=>{
      const t=(S.addSubText[expKey]||"").trim();
      if(!t)return;
      // FIX: reset state FIRST
      S.addingSubFor[expKey]=false;
      S.addSubText[expKey]="";
      S.expandedSubs[expKey]=true;
      const updatedPt={...pt,subs:[...(pt.subs||[]),newSub(t)]};
      onChange(updatedPt);
    };
    ta2.onkeydown=e=>{
      if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();doSub();}
      if(e.key==="Escape"){S.addingSubFor[expKey]=false;S.addSubText[expKey]="";render();}
    };
    const ar=el("div",{className:"add-sub-acts"});
    ar.append(
      el("button",{className:"btn-p",onclick:doSub},"Simpan"),
      el("button",{className:"btn-c",onclick:()=>{S.addingSubFor[expKey]=false;S.addSubText[expKey]="";render();}},"Batal"),
      el("span",{className:"hint"},"Enter · Esc")
    );
    box.append(ta2,ar);div.appendChild(box);
    setTimeout(()=>ta2.focus(),40);
  }
  return div;
}

// ── Section Block ──────────────────────────────────────────────────
function buildSection(secKey,wk,mi,data,onDataChange){
  const sec=SECS.find(s=>s.key===secKey);
  const md=getMd(data,wk,mi);
  const pts=md[secKey]||[];
  const addKey=`${wk}-${mi}-${secKey}`;
  const isAddOpen=!!S.addPtOpen[addKey];
  const hasDone=HAS_DONE.has(secKey);
  const doneC=pts.filter(p=>p.status==="done").length;
  const incC=pts.filter(p=>p.status==="incomplete").length;
  const hasAnySubs=pts.some(p=>p.subs&&p.subs.length);

  const wrap=el("div",{});

  // Show all sub toggle only if needed
  if(hasAnySubs){
    const sh=el("div",{style:{display:"flex",justifyContent:"flex-end",marginBottom:"4px"}});
    const allExp=pts.filter(p=>p.subs&&p.subs.length).every(p=>S.expandedSubs[`${wk}-${mi}-${secKey}-${p.id}`]);
    const sab=el("button",{className:"showall-btn"+(allExp?" open":""),onclick:()=>{
      pts.forEach(p=>{if(p.subs&&p.subs.length)S.expandedSubs[`${wk}-${mi}-${secKey}-${p.id}`]=!allExp;});render();
    }});
    sab.textContent=allExp?"▲ Sembunyikan":"▼ Show all";sh.appendChild(sab);
    wrap.appendChild(sh);
  }

  // Filter + search
  const q=(S.searchQ||"").toLowerCase().trim();
  const fs=S.filterStatus||"all";
  const visible=pts.filter(p=>{
    if(q&&!p.text.toLowerCase().includes(q)&&!(p.subs||[]).some(s=>s.text.toLowerCase().includes(q)))return false;
    if(fs==="done"&&p.status!=="done")return false;
    if(fs==="incomplete"&&p.status!=="incomplete")return false;
    if(fs==="open"&&(p.status==="done"||p.status==="incomplete"))return false;
    return true;
  });

  const plist=el("div",{});
  if(!pts.length){
    plist.appendChild(el("div",{className:"no-pts"},"Belum ada poin"));
  } else if(!visible.length){
    plist.appendChild(el("div",{className:"no-pts",style:{color:"#9ca3af"}},"Tidak ada poin yang cocok"));
  }
  // Group by date, newest date first
  const sortedVisible=[...visible].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  let lastDateKey=null;
  sortedVisible.forEach(pt=>{
    const ri=pts.indexOf(pt);
    const dateKey=fmtD(pt.createdAt);
    if(dateKey!==lastDateKey){
      const dh=el("div",{});
      dh.style.cssText="font-size:11px;color:#9ca3af;font-family:monospace;margin:8px 0 4px;";
      dh.textContent=dateKey;
      plist.appendChild(dh);
      lastDateKey=dateKey;
    }
    plist.appendChild(buildPt(pt,ri,secKey,sec.color,wk,mi,(updated)=>{
      const np=updated===null?pts.filter((_,j)=>j!==ri):pts.map((p,j)=>j===ri?updated:p);
      const now=new Date().toISOString();
      onDataChange(setMd(data,wk,mi,{...md,[secKey]:np,_editedAt:now,_createdAt:md._createdAt||now}));
    }));
  });

  // Add point form
  if(!isAddOpen){
    const ab=el("button",{className:"add-pt-trig",onclick:()=>{
      S.addPtOpen[addKey]=true;
      if(!S.addPtDate[addKey])S.addPtDate[addKey]=td();
      render();
    }});
    ab.textContent="+ Tambah poin";plist.appendChild(ab);
  } else {
    const form=el("div",{className:"add-pt-form"});
    form.style.borderColor=sec.color+"30";
    const dr=el("div",{className:"add-pt-dr"});
    dr.appendChild(el("span",{style:{fontSize:"11px",color:"#9ca3af",flexShrink:0}},"📅 Tanggal:"));
    const di=el("input",{type:"date",className:"inp-date"});
    di.value=S.addPtDate[addKey]||td();
    di.onfocus=e=>e.target.style.borderColor=sec.color;
    di.onblur=e=>e.target.style.borderColor="#e5e7eb";
    di.oninput=e=>S.addPtDate[addKey]=e.target.value;
    dr.appendChild(di);form.appendChild(dr);
    const ta=el("textarea",{className:"add-pt-ta"});
    ta.style.borderColor=sec.color;ta.placeholder="Tulis poin baru...";ta.rows=2;
    ta.value=S.addPtText[addKey]||"";
    ta.oninput=e=>S.addPtText[addKey]=e.target.value;
    const doAdd=()=>{
      const t=(S.addPtText[addKey]||"").trim();if(!t)return;
      const now=new Date().toISOString();
      const np=[...pts,newPt(t,S.addPtDate[addKey]||td())];
      // FIX BUG1: reset state FIRST before onDataChange triggers re-render
      S.addPtText[addKey]="";S.addPtDate[addKey]=td();S.addPtOpen[addKey]=false;
      onDataChange(setMd(data,wk,mi,{...md,[secKey]:np,_editedAt:now,_createdAt:md._createdAt||now}));
    };
    ta.onkeydown=e=>{
      if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();doAdd();}
      if(e.key==="Escape"){S.addPtOpen[addKey]=false;S.addPtText[addKey]="";render();}
    };
    const ar=el("div",{className:"add-pt-acts"});
    ar.append(
      el("button",{className:"btn-p",onclick:doAdd},"Tambah"),

      el("span",{className:"hint"},"Enter · Esc")
    );

}

// ── Paste Input ────────────────────────────────────────────────────
function buildPasteInput(wk,mi,data,onDataChange){
  if(!S.pasteText)S.pasteText={};
  if(!S.pasteItems)S.pasteItems={};
  const rawText=S.pasteText[mi]||"";
  const items=S.pasteItems[mi]||null; // null = belum diconvert

  const wrap=el("div",{className:"quick-wrap"});

  if(!items){
    // Phase 1: area paste teks
    wrap.appendChild(el("div",{style:{fontSize:"11px",color:"#9ca3af",marginBottom:"8px"}},"Paste teks dari notepad — tiap baris (Enter) jadi 1 poin"));
    const ta=el("textarea",{});
    ta.placeholder="Paste teks di sini...\nSetiap baris baru = 1 poin";
    ta.value=rawText;
    ta.style.cssText="width:100%;min-height:140px;border:1px solid #e5e7eb;border-radius:8px;padding:10px 12px;font-size:13px;line-height:1.7;background:#fafafa;resize:vertical;";
    ta.onfocus=e=>{e.target.style.borderColor="#6366f1";e.target.style.background="#fff";};
    ta.onblur=e=>{e.target.style.borderColor="#e5e7eb";e.target.style.background="#fafafa";};
    ta.oninput=e=>S.pasteText[mi]=e.target.value;
    wrap.appendChild(ta);
    setTimeout(()=>ta.focus(),40);

    const ar=el("div",{style:{display:"flex",gap:"6px",marginTop:"8px"}});
    const convB=el("button",{className:"q-apply",onclick:()=>{
      const lines=(ta.value||"").split("\n").map(l=>l.trim()).filter(l=>l.length>0);
      if(!lines.length){showToast("Paste teks dulu!");return;}
      S.pasteText[mi]=ta.value;
      // Preserve category: check current items first, then prevPasteItems
      const prev=[...(S.pasteItems[mi]||[]),...((S.prevPasteItems||{})[mi]||[])];
      S.pasteItems[mi]=lines.map(text=>{
        const existing=prev.find(p=>p.text===text);
        return {id:Date.now()+Math.random(),text,section:existing?existing.section:"hasil",date:existing?existing.date:td()};
      });
      render();
    }});
    convB.textContent="→ Konversi ke baris";
    const cancB=el("button",{className:"q-cancel",onclick:()=>{S.cardMode[mi]="detail";render();}});
    cancB.textContent="Batal";
    ar.append(convB,cancB);wrap.appendChild(ar);

  } else {
    // Phase 2: pilih kategori per baris (sama seperti Quick)
    wrap.appendChild(el("div",{style:{fontSize:"11px",color:"#9ca3af",marginBottom:"8px"}},"Pilih kategori tiap baris → Terapkan"));
    const list=el("div",{className:"quick-list"});
    items.forEach((item,idx)=>{
      const sec=SECS.find(s=>s.key===item.section)||SECS[0];
      const row=el("div",{className:"quick-row"});
      row.style.borderColor=sec.color+"25";
      const num=el("span",{className:"quick-num"},String(idx+1));
      num.style.cssText=`background:${sec.color}15;color:${sec.color};`;
      // Text read-only display
      const txt=el("div",{style:{flex:1,fontSize:"13px",color:"#111827",lineHeight:"1.5",padding:"2px 0",userSelect:"text"}});
      txt.textContent=item.text;
      const acts=el("div",{className:"quick-acts"});
      const di=el("input",{type:"date",className:"quick-date"});
      di.value=item.date;
      di.onfocus=e=>e.target.style.borderColor=sec.color;
      di.onblur=e=>e.target.style.borderColor="#f0f0f0";
      di.oninput=e=>items[idx].date=e.target.value;
      const se=el("select",{className:"quick-sel"});
      se.style.cssText=`color:${sec.color};border-color:${sec.color}35;background:${sec.color}08;`;
      SECS.forEach(s=>{
        const o=el("option",{value:s.key},`${s.icon} ${s.label}`);
        if(s.key===item.section)o.selected=true;
        se.appendChild(o);
      });
      se.onchange=e=>{
        items[idx].section=e.target.value;
        const s2=SECS.find(s=>s.key===e.target.value)||SECS[0];
        num.style.cssText=`background:${s2.color}15;color:${s2.color};`;
        row.style.borderColor=s2.color+"25";
        se.style.cssText=`color:${s2.color};border-color:${s2.color}35;background:${s2.color}08;`;
      };
      const del=el("button",{className:"quick-del",onclick:()=>{
        S.pasteItems[mi]=items.filter((_,j)=>j!==idx);
        if(!S.pasteItems[mi].length){S.pasteItems[mi]=null;}
        render();
      }});del.textContent="×";
      acts.append(di,se,del);row.append(num,txt,acts);list.appendChild(row);
    });
    wrap.appendChild(list);

    const ar=el("div",{style:{display:"flex",gap:"6px",flexWrap:"wrap",alignItems:"center"}});
    const ap=el("button",{className:"q-apply",onclick:()=>{
      const v=items.filter(r=>r.text.trim());if(!v.length)return;
      const md=getMd(data,wk,mi);const now=new Date().toISOString();
      const upd={...md};SECS.forEach(s=>{if(!upd[s.key])upd[s.key]=[];});
      v.forEach(r=>upd[r.section].push(newPt(r.text.trim(),r.date)));
      upd._editedAt=now;upd._createdAt=md._createdAt||now;
      // Reset all paste state FIRST
      S.pasteText[mi]="";S.pasteItems[mi]=null;S.cardMode[mi]="detail";
      onDataChange(setMd(data,wk,mi,upd));
    }});ap.textContent="✓ Terapkan";
    const backB=el("button",{className:"q-cancel",onclick:()=>{
      // Simpan items dulu ke prevItems sebelum balik ke edit teks
      S.prevPasteItems=S.prevPasteItems||{};
      S.prevPasteItems[mi]=[...items];
      S.pasteItems[mi]=null;
      render();
    }});
    backB.textContent="← Edit teks";
    const cancB=el("button",{className:"q-cancel",onclick:()=>{
      S.pasteText[mi]="";S.pasteItems[mi]=null;S.cardMode[mi]="detail";render();
    }});cancB.textContent="Batal";
    ar.append(ap,backB,cancB);wrap.appendChild(ar);
  }
  return wrap;
}

// ── Section Read+Edit (past weeks — no add new) ───────────────────
function buildSectionReadEdit(secKey,wk,mi,data,onDataChange,sec,pts){
  const md=getMd(data,wk,mi);
  const q=(S.searchQ||"").toLowerCase().trim();
  const fs=S.filterStatus||"all";
  const visible=pts.filter(p=>{
    if(q&&!p.text.toLowerCase().includes(q)&&!(p.subs||[]).some(s=>s.text.toLowerCase().includes(q)))return false;
    if(fs==="done"&&p.status!=="done")return false;
    if(fs==="incomplete"&&p.status!=="incomplete")return false;
    if(fs==="open"&&(p.status==="done"||p.status==="incomplete"))return false;
    return true;
  });
  const wrap=el("div",{});
  if(!pts.length){
    wrap.appendChild(el("div",{style:{fontSize:"11px",color:"#e5e7eb",padding:"2px 0"}},"Belum ada poin"));
    return wrap;
  }
  if(visible.length===0){
    wrap.appendChild(el("div",{style:{fontSize:"11px",color:"#9ca3af",padding:"2px 0"}},"Tidak ada yang cocok"));
    return wrap;
  }
  const sortedVisible=[...visible].sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  let lastDateKey=null;
  sortedVisible.forEach(pt=>{
    const ri=pts.indexOf(pt);
    const dateKey=fmtD(pt.createdAt);
    if(dateKey!==lastDateKey){
      const dh=el("div",{});
      dh.style.cssText="font-size:11px;color:#9ca3af;font-family:monospace;margin:8px 0 4px;";
      dh.textContent=dateKey;
      wrap.appendChild(dh);
      lastDateKey=dateKey;
    }
    wrap.appendChild(buildPt(pt,ri,secKey,sec.color,wk,mi,(updated)=>{
      const np=updated===null?pts.filter((_,j)=>j!==ri):pts.map((p,j)=>j===ri?updated:p);
      const now=new Date().toISOString();
      onDataChange(setMd(data,wk,mi,{...md,[secKey]:np,_editedAt:now,_createdAt:md._createdAt||now}));
    }));
  });
  return wrap;
}

// ── Current Card ───────────────────────────────────────────────────
function buildCurrentCard(wk,mi,data,onDataChange){
  const md=getMd(data,wk,mi);
  const mode=S.cardMode[mi]||"detail";
  const activeSec=S.cardSection[mi]||"targets";
  const sec=SECS.find(s=>s.key===activeSec);

  const card=el("div",{className:"card"});
  const hdr=el("div",{className:"card-hdr"});
  const left=el("div",{className:"card-hdr-l"});
  left.append(el("div",{className:"mem-num"},String(mi+1)),el("span",{className:"mem-name"},S.members[mi]));
  const right=el("div",{style:{display:"flex",alignItems:"center",gap:"8px"}});
  if(md._editedAt)right.appendChild(el("span",{className:"ts-sm"},"Edit "+fmtDT(md._editedAt)));
  const tog=el("div",{className:"mode-tog"});
  const pb2=el("button",{className:"mode-btn"+(mode==="paste"?" active":""),onclick:()=>{
    S.cardMode[mi]="paste";
    if(!S.pasteText)S.pasteText={};
    if(!S.pasteText[mi])S.pasteText[mi]="";
    render();
  }});pb2.textContent="📋 Paste";
  const qb=el("button",{className:"mode-btn"+(mode==="quick"?" active":""),onclick:()=>{
    S.cardMode[mi]="quick";
    if(!S.quickItems[mi]||!S.quickItems[mi].length)
      S.quickItems[mi]=[{id:Date.now(),text:"",section:"hasil",date:td()}];
    render();
  }});qb.textContent="⚡ Quick";
  const db=el("button",{className:"mode-btn"+(mode==="detail"?" active":""),onclick:()=>{S.cardMode[mi]="detail";render();}});db.textContent="🗂 Detail";
  tog.append(pb2,qb,db);right.appendChild(tog);hdr.append(left,right);card.appendChild(hdr);

  if(mode==="paste"){
    card.appendChild(buildPasteInput(wk,mi,data,onDataChange));
  } else if(mode==="quick"){
    card.appendChild(buildQuickInput(wk,mi,data,onDataChange));
  } else {
    // Detail mode — tampilkan poin dari SEMUA minggu, digabung per section
    // Kumpulkan semua minggu urut dari terbaru ke terlama
    const allWeeks=Object.keys(data).sort((a,b)=>b.localeCompare(a));
    if(!allWeeks.includes(wk))allWeeks.unshift(wk);

    const tabs=el("div",{className:"sec-tabs"});
    SECS.forEach(s=>{
      // Hitung total poin semua minggu untuk badge
      const totalPts=allWeeks.flatMap(w2=>(data?.[w2]?.[mi]?.[s.key]||[]));
      const done=totalPts.filter(p=>p.status==="done").length;
      const inc=totalPts.filter(p=>p.status==="incomplete").length;
      const hd=HAS_DONE.has(s.key);
      const t=el("button",{className:"sec-tab"+(activeSec===s.key?" active":""),onclick:()=>{S.cardSection[mi]=s.key;render();}});
      if(activeSec===s.key)t.style.cssText=`color:${s.color};border-bottom-color:${s.color};`;
      t.textContent=`${s.icon} ${s.label}`;
      if(totalPts.length){
        const sm=el("span",{style:{display:"block",fontSize:"9px",fontFamily:"monospace",opacity:"0.75"}});
        sm.textContent=hd?`${done}✓${inc>0?" "+inc+"✗":""}/${totalPts.length}`:String(totalPts.length);
        t.appendChild(sm);
      }
      tabs.appendChild(t);
    });
    card.appendChild(tabs);

    const body=el("div",{className:"sec-body"});
    const sec=SECS.find(s=>s.key===activeSec);

    // Render tiap minggu dari terbaru ke terlama
    allWeeks.forEach(w2=>{
      const wkMd=getMd(data,w2,mi);
      const pts=wkMd[activeSec]||[];
      const isCurrentWk=w2===wk;
      if(!pts.length&&!isCurrentWk)return;

      if(isCurrentWk){
        body.appendChild(buildSection(activeSec,w2,mi,data,onDataChange));
      } else {
        body.appendChild(buildSectionReadEdit(activeSec,w2,mi,data,onDataChange,sec,pts));
      }
    });

    card.appendChild(body);
  }
  return card;
}

// ── Quick Input ────────────────────────────────────────────────────
function buildQuickInput(wk,mi,data,onDataChange){
  // BUG1 FIX: quickItems[mi] is the source of truth, we mutate it directly
  // BUG2 FIX: changing category does NOT call render() — only updates style inline
  if(!S.quickItems[mi]||!S.quickItems[mi].length)
    S.quickItems[mi]=[{id:Date.now(),text:"",section:"hasil",date:td()}];
  const items=S.quickItems[mi];

  const wrap=el("div",{className:"quick-wrap"});
  const list=el("div",{className:"quick-list"});
  items.forEach((item,idx)=>{
    const sec=SECS.find(s=>s.key===item.section)||SECS[0];
    const row=el("div",{className:"quick-row"});
    row.style.borderColor=sec.color+"25";
    const num=el("span",{className:"quick-num"},String(idx+1));
    num.style.cssText=`background:${sec.color}15;color:${sec.color};`;
    const ta=el("textarea",{className:"quick-ta"});
    ta.value=item.text;ta.rows=1;ta.placeholder="Tulis poin...";
    // BUG1 FIX: update text in-place without re-render
    ta.oninput=e=>{autoResize(e.target);items[idx].text=e.target.value;};
    ta.onfocus=e=>autoResize(e.target);
    setTimeout(()=>autoResize(ta),0);
    const acts=el("div",{className:"quick-acts"});
    const di=el("input",{type:"date",className:"quick-date"});
    di.value=item.date;
    di.onfocus=e=>e.target.style.borderColor=sec.color;
    di.onblur=e=>e.target.style.borderColor="#f0f0f0";
    // BUG1 FIX: update date in-place
    di.oninput=e=>items[idx].date=e.target.value;
    const se=el("select",{className:"quick-sel"});
    se.style.cssText=`color:${sec.color};border-color:${sec.color}35;background:${sec.color}08;`;
    SECS.forEach(s=>{
      const o=el("option",{value:s.key},`${s.icon} ${s.label}`);
      if(s.key===item.section)o.selected=true;
      se.appendChild(o);
    });
    // BUG1 FIX: change category WITHOUT re-render — update style inline
    se.onchange=e=>{
      items[idx].section=e.target.value;
      const s2=SECS.find(s=>s.key===e.target.value)||SECS[0];
      num.style.cssText=`background:${s2.color}15;color:${s2.color};`;
      row.style.borderColor=s2.color+"25";
      se.style.cssText=`color:${s2.color};border-color:${s2.color}35;background:${s2.color}08;`;
    };
    const del=el("button",{className:"quick-del",onclick:()=>{
      S.quickItems[mi]=items.filter((_,j)=>j!==idx);
      if(!S.quickItems[mi].length)S.quickItems[mi]=[{id:Date.now(),text:"",section:"hasil",date:td()}];
      render();
    }});del.textContent="×";
    acts.append(di,se,del);row.append(num,ta,acts);list.appendChild(row);
  });
  wrap.appendChild(list);

  const addB=el("button",{className:"add-row-btn",onclick:()=>{
    S.quickItems[mi].push({id:Date.now()+Math.random(),text:"",section:"hasil",date:td()});
    render();
  }});addB.textContent="+ Tambah baris";wrap.appendChild(addB);

  const valid=items.filter(r=>r.text.trim());
  const grouped=SECS.map(s=>({...s,rows:valid.filter(r=>r.section===s.key)})).filter(s=>s.rows.length);
  if(grouped.length){
    const prev=el("div",{className:"prev-box"});
    prev.appendChild(el("div",{className:"prev-lbl"},"Akan masuk ke:"));
    const tags=el("div",{className:"prev-tags"});
    grouped.forEach(s=>{
      const tag=el("span",{className:"prev-tag"});
      tag.style.cssText=`background:${s.color}10;color:${s.color};border:1px solid ${s.color}25;`;
      tag.textContent=`${s.icon} ${s.label} ${s.rows.length}`;
      tags.appendChild(tag);
    });
    prev.appendChild(tags);wrap.appendChild(prev);
  }

  const ar=el("div",{className:"q-acts"});
  const ap=el("button",{className:"q-apply",onclick:()=>{
    const v=items.filter(r=>r.text.trim());if(!v.length)return;
    const md=getMd(data,wk,mi);
    const now=new Date().toISOString();
    const upd={...md};
    SECS.forEach(s=>{if(!upd[s.key])upd[s.key]=[];});
    v.forEach(r=>upd[r.section].push(newPt(r.text.trim(),r.date)));
    upd._editedAt=now;upd._createdAt=md._createdAt||now;
    onDataChange(setMd(data,wk,mi,upd));
    // BUG3 FIX: reset quick state completely after apply
    S.quickItems[mi]=[{id:Date.now(),text:"",section:"hasil",date:td()}];
    S.cardMode[mi]="detail";
  }});
  ap.textContent="✓ Terapkan";ap.disabled=!valid.length;
  ar.append(ap,el("button",{className:"q-cancel",onclick:()=>{S.cardMode[mi]="detail";render();}},"Batal"));
  wrap.appendChild(ar);return wrap;
}

// ── Dashboard Card ─────────────────────────────────────────────────
function buildDashCard(mi,wk,data){
  const md=getMd(data,wk,mi);
  const all=SECS.flatMap(s=>md[s.key]||[]);
  const dc=all.filter(p=>p.status==="done").length;
  const ic=all.filter(p=>p.status==="incomplete").length;
  const oc=all.length-dc-ic,tot=all.length;
  const pct=tot>0?Math.round((dc/tot)*100):0,has=tot>0;
  const card=el("div",{className:"dash-card",style:{opacity:has?"1":"0.45"},onclick:()=>{S.activeMember=mi;S.view="meeting";render();}});
  const hdr=el("div",{className:"dash-hdr"});
  const left=el("div",{style:{display:"flex",alignItems:"center",gap:"6px"}});
  left.append(
    el("div",{className:"mem-num",style:{width:"20px",height:"20px",fontSize:"9px"}},String(mi+1)),
    el("span",{style:{fontSize:"12px",fontWeight:600,color:"#111827"}},S.members[mi])
  );
  hdr.appendChild(left);
  if(has){
    const right=el("div",{style:{display:"flex",gap:"3px"}});
    if(dc>0)right.appendChild(el("span",{className:"chip",style:{background:"#d1fae5",color:"#059669",fontWeight:700}},`✓${dc}`));
    if(ic>0)right.appendChild(el("span",{className:"chip",style:{background:"#fee2e2",color:"#dc2626",fontWeight:700}},`✗${ic}`));
    if(oc>0)right.appendChild(el("span",{className:"chip",style:{background:"#f3f4f6",color:"#6b7280"}},`○${oc}`));
    hdr.appendChild(right);
  }
  card.appendChild(hdr);
  if(has){
    const pb=el("div",{className:"dash-pb"});
    const pr=el("div",{className:"dash-pb-row"});
    pr.append(el("span",{style:{fontSize:"10px",color:"#9ca3af"}},"Done rate"),el("span",{style:{fontSize:"10px",color:"#111827",fontFamily:"monospace",fontWeight:600}},pct+"%"));
    pb.appendChild(pr);
    const track=el("div",{className:"dash-pb-track"});
    track.append(el("div",{style:{width:pct+"%",background:"#10b981"}}),el("div",{style:{width:(tot>0?Math.round((ic/tot)*100):0)+"%",background:"#ef4444"}}));
    pb.appendChild(track);card.appendChild(pb);
  }
  const body=el("div",{className:"dash-body"});
  if(!has)body.appendChild(el("div",{style:{fontSize:"11px",color:"#e5e7eb",textAlign:"center",padding:"5px 0"}},"Belum ada data"));
  SECS.forEach(s=>{
    const pts=md[s.key]||[];if(!pts.length)return;
    const sd=pts.filter(p=>p.status==="done").length;
    const si2=pts.filter(p=>p.status==="incomplete").length;
    const hd=HAS_DONE.has(s.key);
    const sec=el("div",{className:"dash-sec"});
    const sh=el("div",{className:"dash-sec-hdr"});
    sh.append(
      el("span",{style:{fontSize:"11px",color:s.color,fontWeight:600}},`${s.icon} ${s.label}`),
      el("span",{style:{fontSize:"10px",color:"#d1d5db",fontFamily:"monospace"}},hd?`${sd}✓${si2>0?" "+si2+"✗":""}/${pts.length}`:String(pts.length))
    );
    sec.appendChild(sh);
    pts.forEach((p,pi)=>{
      const id=p.status==="done",ii=p.status==="incomplete";
      const row=el("div",{className:"dash-pt-row"});
      row.append(
        el("span",{style:{minWidth:"13px",fontSize:"9px",color:id?"#10b981":ii?"#ef4444":"#d1d5db",fontFamily:"monospace",fontWeight:700,marginTop:"2px"}},`${pi+1}.`),
        el("span",{style:{fontSize:"11px",color:id?"#059669":ii?"#dc2626":"#374151",lineHeight:"1.4",flex:1}},p.text.length>50?p.text.slice(0,50)+"…":p.text)
      );
      if(id||ii)row.appendChild(el("span",{style:{fontSize:"9px",flexShrink:0,background:id?"#d1fae5":"#fee2e2",color:id?"#059669":"#dc2626",borderRadius:"8px",padding:"1px 4px"}},id?"✓":"✗"));
      sec.appendChild(row);
    });
    body.appendChild(sec);
  });
  card.appendChild(body);return card;
}

// ── Exports ────────────────────────────────────────────────────────
function exportExcel(){
  if(!window.XLSX){
    const script=document.createElement("script");

function doExportExcel(){
  const wb=XLSX.utils.book_new();
  const weeks=getWeeks();

  S.members.forEach((member,mi)=>{
    const rows=[];
    rows.push(["Minggu","Kategori","No","Poin","Status","Tgl Poin","Tgl Selesai","Updates"]);

    weeks.forEach(wk=>{
      const md=S.data?.[wk]?.[mi]||{};
      const hasAny=SECS.some(s=>(md[s.key]||[]).length>0);
      if(!hasAny)return;

      SECS.forEach(sec=>{
        const pts=md[sec.key]||[];
        pts.forEach((pt,pi)=>{
          const subs=(pt.subs||[]).map(sb=>`[${fmtD(sb.createdAt)}] ${sb.text}`).join("\n");
          rows.push([
            weekLabel(wk),sec.label,pi+1,pt.text,
            pt.status==="done"?"Done":pt.status==="incomplete"?"Incomplete":"Open",
            fmtD(pt.createdAt),
            pt.doneAt?fmtD(pt.doneAt):"",
            subs
          ]);
        });
      });
    });

    const ws=XLSX.utils.aoa_to_sheet(rows);
    ws["!cols"]=[{wch:20},{wch:12},{wch:4},{wch:50},{wch:12},{wch:14},{wch:14},{wch:40}];
    XLSX.utils.book_append_sheet(wb,ws,member.slice(0,31));
  });

  const date=new Date().toISOString().split("T")[0];
  XLSX.writeFile(wb,`meeting-${date}.xlsx`);
  showToast("Excel diexport!");
}

// ── Offline Sales (angka dalam juta Rp, tersimpan di cloud) ─────────
const BRANDS=["NVMEE","Pandaoma","Reebit","Honey Boo"];
const MONTHS_ID=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
S.sales={data:{},base:null,loaded:false,loading:false,err:"",conflict:false};
S.salesYear=new Date().getFullYear();S.salesTab="all";S.salesForm=null;S.cellEdit=null;

const nf=new Intl.NumberFormat("id-ID",{maximumFractionDigits:2});
function fmtN(v){return v==null?"–":nf.format(v);}
function fmtRaw(v){return v==null?"":String(v).replace(".",",");}
function parseN(t){
  t=String(t==null?"":t).trim().replace(/\s/g,"");
  if(t==="")return{v:null};
  let c;
  if(t.includes(","))c=t.replace(/\./g,"").replace(",",".");
  else if(/^-?\d{1,3}(\.\d{3})+$/.test(t))c=t.replace(/\./g,"");
  else c=t;
  if(!/^-?\d+(\.\d+)?$/.test(c))return{err:true};
  return{v:parseFloat(c)};
}
function emptyEntry(){return{s:[null,null,null,null],g:[null,null,null,null],ex:null};}
function getEntry(y,mi){const d=S.sales.data[y];const e=d&&d[mi];return e?{s:[...e.s],g:[...e.g],ex:e.ex}:emptyEntry();}
function setEntry(y,mi,e){if(!S.sales.data[y])S.sales.data[y]={};S.sales.data[y][mi]=e;}
function entryHas(e){return e.s.concat(e.g,[e.ex]).some(v=>v!=null);}
function countMonths(){let n=0;for(const y of Object.keys(S.sales.data))for(const m of Object.keys(S.sales.data[y]||{}))if(entryHas(S.sales.data[y][m]))n++;return n;}
function calc(e){
  const sSum=e.s.reduce((a,v)=>a+(v||0),0),gSum=e.g.reduce((a,v)=>a+(v||0),0);
  const sAll=e.s.every(v=>v!=null),gAll=e.g.every(v=>v!=null);
  return{sSum,gSum,sAny:e.s.some(v=>v!=null),gAny:e.g.some(v=>v!=null),sAll,gAll,full:sAll&&gAll&&e.ex!=null};
}
function pctOf(g,s){return(s>0&&g!=null&&s!=null)?g/s*100:null;}
function fmtP(p){return p==null?"–":p.toFixed(1).replace(".",",")+"%";}

async function loadSales(){
  if(!CLOUD){S.sales.loading=false;S.sales.err="Menu Offline Sales hanya tersedia di versi online.";render();return;}
  const tk=getToken();if(!tk){S.sales.loading=false;return;}
  try{
    const d=await rpc("sales_pull",{p_token:tk});
    if(d){S.sales.data=d.data||{};S.sales.base=d.updated_at;}
    S.sales.loaded=true;S.sales.err="";S.sales.conflict=false;
  }catch(e){S.sales.err="Gagal memuat data Offline Sales ("+e.message+")";}
  S.sales.loading=false;render();
}
let salesTimer=null;
function scheduleSalesSave(){clearTimeout(salesTimer);salesTimer=setTimeout(saveSales,500);}
async function saveSales(){
  if(!S.sales.loaded||S.sales.conflict)return;
  const n=countMonths();
  if(n===0){showToast("Data kosong tidak disimpan ke cloud");return;}
  try{
    const r=await rpc("sales_push",{p_token:getToken(),p_data:S.sales.data,p_count:n,p_base:S.sales.base});
    S.sales.base=r.updated_at;showToast("✓ Tersimpan online");
  }catch(e){
    if(/conflict/.test(e.message)){S.sales.conflict=true;render();return;}
    if(/unauthorized/.test(e.message)){setToken("");S.loaded=false;S.needLogin=true;S.loginErr="Sesi berakhir, masukkan kata sandi lagi.";render();return;}
    showToast("⚠ Gagal simpan, mencoba lagi...");clearTimeout(salesTimer);salesTimer=setTimeout(saveSales,5000);
  }
}

function openSalesForm(mi){
  const e=getEntry(S.salesYear,mi);
  S.salesForm={mi,vals:[...e.s,...e.g,e.ex].map(fmtRaw),err:""};render();
}
function submitSalesForm(){
  const f=S.salesForm,vals=[];
  for(const t of f.vals){const p=parseN(t);if(p.err){f.err="Ada angka yang tidak valid. Pakai angka saja, koma untuk desimal (contoh 125,5).";render();return;}vals.push(p.v);}
  const e={s:vals.slice(0,4),g:vals.slice(4,8),ex:vals[8]};
  const bad=[];for(let k=0;k<4;k++)if(e.s[k]!=null&&e.g[k]!=null&&e.g[k]>e.s[k])bad.push(BRANDS[k]);
  if(bad.length&&!window.confirm("Gross Profit lebih besar dari Sales untuk: "+bad.join(", ")+".\nBiasanya ini salah ketik. Tetap simpan?"))return;
  const blank=vals.filter(v=>v==null).length;
  if(blank>0&&blank<9&&!window.confirm(blank+" kotak masih kosong.\nKosong = belum diisi (Margin/Profit Akhir tidak dihitung). Isi 0 jika memang tidak ada.\nTetap simpan?"))return;
  if(blank===9){f.err="Semua kotak kosong.";render();return;}
  setEntry(S.salesYear,f.mi,e);S.salesForm=null;scheduleSalesSave();showToast(MONTHS_ID[f.mi]+" "+S.salesYear+" disimpan");
}
function commitCell(){
  const c=S.cellEdit;if(!c)return;S.cellEdit=null;
  const p=parseN(c.input.value);
  if(p.err){showToast("Angka tidak valid, perubahan dibatalkan");return;}
  const e=getEntry(S.salesYear,c.mi);
  if(c.type==="ex")e.ex=p.v;else e[c.type][c.k]=p.v;
  setEntry(S.salesYear,c.mi,e);scheduleSalesSave();render();
}
function ensureXlsx(cb){
  if(window.XLSX){cb();return;}
  const sc=document.createElement("script");sc.src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";sc.onload=cb;document.head.appendChild(sc);
}
function exportSalesExcel(){
  ensureXlsx(()=>{
    const y=S.salesYear;
    const head=["Bulan",...BRANDS.map(b=>"Sales "+b),"Total Sales",...BRANDS.map(b=>"GP "+b),"Total GP",...BRANDS.map(b=>"Margin % "+b),"Total Margin %","Pengeluaran","Profit Akhir"];
    const rows=[["Offline Sales "+y+" (Rp juta)"],[],head];
    for(let mi=0;mi<12;mi++){
      const e=getEntry(y,mi),c=calc(e);
      if(!entryHas(e)){rows.push([MONTHS_ID[mi]]);continue;}
      rows.push([MONTHS_ID[mi],...e.s,c.sAny?c.sSum:null,...e.g,c.gAny?c.gSum:null,
        ...e.s.map((s,k)=>{const p=pctOf(e.g[k],s);return p==null?null:Math.round(p*10)/10;}),
        (c.sAll&&c.gAll&&c.sSum>0)?Math.round(c.gSum/c.sSum*1000)/10:null,e.ex,c.full?c.gSum-e.ex:null]);
    }
    const ws=XLSX.utils.aoa_to_sheet(rows),wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"Offline Sales "+y);XLSX.writeFile(wb,"offline-sales-"+y+".xlsx");
  });
}

function buildSalesContent(ct){
  if(S.sales.conflict){
    const w=el("div",{className:"sl-warn"},"⚠️ Data Offline Sales sudah diubah dari perangkat lain. Perubahan terakhirmu BELUM tersimpan.");
    ct.appendChild(w);
    ct.appendChild(el("button",{className:"sl-btn",onclick:()=>{S.sales.loaded=false;S.sales.loading=true;S.sales.conflict=false;S.salesForm=null;S.cellEdit=null;setTimeout(loadSales,0);render();}},"🔄 Muat ulang data terbaru"));
    return;
  }
  if(S.sales.err){
    ct.appendChild(el("div",{className:"sl-warn"},"⚠️ "+S.sales.err));
    if(CLOUD)ct.appendChild(el("button",{className:"sl-btn",onclick:()=>{S.sales.err="";render();}},"🔄 Coba lagi"));

  if(!S.sales.loaded){

  const y=S.salesYear;

    if(c.full)TP+=c.gSum-e.ex;
    if(c.sAll&&c.gAll){TSf+=c.sSum;TGf+=c.gSum;}
    for(let k=0;k<4;k++){bs[k]+=e.s[k]||0;bg[k]+=e.g[k]||0;if(e.s[k]!=null&&e.g[k]!=null){bsp[k]+=e.s[k];bgp[k]+=e.g[k];}}

        inp.addEventListener("input",()=>{f.vals[idx]=inp.value;});
        inp.addEventListener("keydown",ev=>{if(ev.key==="Enter"){ev.preventDefault();if(idx<8)inputs[idx+1].focus();else submitSalesForm();}});

  });

// ── Backup & Pulihkan (satu file JSON: meeting + Offline Sales) ─────
function getLastBackup(){try{return localStorage.getItem("mm_last_backup")||"";}catch(e){return "";}}
function setLastBackup(v){try{localStorage.setItem("mm_last_backup",v);}catch(e){}}
async function ensureSalesLoaded(){
  if(S.sales.loaded||!CLOUD)return S.sales.loaded;
  try{const d=await rpc("sales_pull",{p_token:getToken()});if(d){S.sales.data=d.data||{};S.sales.base=d.updated_at;}S.sales.loaded=true;S.sales.err="";}catch(e){return false;}
  return true;
}
function downloadJson(obj,name){
  const b=new Blob([JSON.stringify(obj,null,2)],{type:"application/json"}),a=document.createElement("a");
  a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);
}
async function backupAll(silent){
  if(!S.loaded){alert("Data belum termuat, backup dibatalkan.");return false;}
  const okS=await ensureSalesLoaded();
  if(CLOUD&&!okS&&!window.confirm("Data Offline Sales gagal dimuat, jadi tidak ikut di backup. Tetap backup data meeting saja?"))return false;
  const d=new Date(),ymd=d.toISOString().slice(0,10);
  downloadJson({app:"gii-meeting-backup",version:1,exportedAt:d.toISOString(),
    meeting:{data:S.data,members:S.members},sales:{data:okS?S.sales.data:null}},"gii-meeting-backup-"+ymd+"-"+String(d.getHours()).padStart(2,"0")+String(d.getMinutes()).padStart(2,"0")+".json");
  setLastBackup(ymd);if(!silent)showToast("💾 Backup diunduh");else render();
  return true;
}
function pickRestoreFile(){
  const fi=document.createElement("input");fi.type="file";fi.accept=".json,application/json";
  fi.addEventListener("change",()=>{
    const f=fi.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=async()=>{
      let o;try{o=JSON.parse(rd.result);}catch(e){alert("File tidak valid (bukan JSON).");return;}
      const meet=o.meeting||(o.data?{data:o.data,members:o.members}:null);
      const salesD=o.sales&&o.sales.data?o.sales.data:null;
      const mp=meet?countPoints(meet.data):0;
      let sm=0;if(salesD)for(const y of Object.keys(salesD))for(const m of Object.keys(salesD[y]||{}))if(entryHas(salesD[y][m]))sm++;
      if(mp===0&&sm===0){alert("File ini tidak berisi data meeting maupun Offline Sales.");return;}
      const msg="File berisi:\n• "+mp+" poin meeting"+(meet&&meet.members?" ("+meet.members.length+" anggota)":"")+"\n• "+sm+" bulan Offline Sales"+
        "\n\nIni akan MENGGANTI data yang ada sekarang di cloud.\nBackup data saat ini akan diunduh otomatis dulu sebagai pengaman.\n\nLanjutkan?";
      if(!window.confirm(msg))return;
      if(!(await backupAll(true)))return;
      if(mp>0){S.data=meet.data;if(meet.members&&meet.members.length)S.members=meet.members;S.undoStack=[];S.redoStack=[];scheduleSave();}
      if(sm>0&&CLOUD){
        if(await ensureSalesLoaded()){S.sales.data=salesD;scheduleSalesSave();}
        else alert("Data Offline Sales gagal dipulihkan (cloud tidak terjangkau). Data meeting tetap dipulihkan.");
      }
      render();showToast("✓ Data dipulihkan");
    };
    rd.readAsText(f);
  });
  fi.click();
}
function buildBackupFooter(sb){
  const foot=el("div",{className:"sb-foot"});
  const last=getLastBackup();
  let old=true,txt="Belum pernah backup";
  if(last){const days=Math.floor((Date.now()-new Date(last).getTime())/864e5);old=days>30;txt="Backup terakhir: "+last+(days>0?" ("+days+" hr lalu)":" (hari ini)");}
  const st=el("div",{className:"sb-bk-st"+(old?" warn":"")},txt);
  const row=el("div",{className:"sb-bk-row"});
  row.appendChild(el("button",{className:"sb-bk-btn",onclick:()=>backupAll(false)},"💾 Backup"));
  row.appendChild(el("button",{className:"sb-bk-btn",onclick:pickRestoreFile},"♻️ Pulihkan"));
  foot.append(st,row);sb.appendChild(foot);
}

        const inp=el("input",{type:"text",className:"set-inp"});inp.value=S.editNameVal;
        inp.oninput=e=>S.editNameVal=e.target.value;
        inp.onkeydown=e=>{if(e.key==="Enter"){const nm=[...S.members];nm[i]=S.editNameVal.trim()||m;saveMembers(nm);S.editingMember=null;showToast("Tersimpan");}if(e.key==="Escape"){S.editingMember=null;render();}};
        const sb=el("button",{className:"set-save",onclick:()=>{const nm=[...S.members];nm[i]=S.editNameVal.trim()||m;saveMembers(nm);S.editingMember=null;showToast("Tersimpan");}},"✓");
        const cb=el("button",{className:"set-canc",onclick:()=>{S.editingMember=null;render();}},"✕");
        row.append(inp,sb,cb);setTimeout(()=>inp.focus(),40);
      } else {
        const nb=el("div",{className:"set-box"},m);
        const eb=el("button",{className:"set-edit",onclick:()=>{S.editingMember=i;S.editNameVal=m;render();}},"✏️");
        const db=el("button",{className:"set-del",onclick:()=>{
          if(!window.confirm(`Hapus "${m}"?`))return;
          const nm=S.members.filter((_,j)=>j!==i);
          if(S.activeMember>=nm.length)S.activeMember=Math.max(0,nm.length-1);
          saveMembers(nm);showToast(`${m} dihapus`);
        }},"🗑");
        row.append(nb,eb,db);
      }
      wrap.appendChild(row);
    });
    // Add member
    const addRow=el("div",{style:{marginTop:"12px",display:"flex",gap:"7px",alignItems:"center"}});
    const addInp=el("input",{type:"text",className:"set-inp",placeholder:"Nama anggota baru..."});
    addInp.style.flex="1";
    const doAddMember=()=>{const name=addInp.value.trim();if(!name)return;saveMembers([...S.members,name]);addInp.value="";showToast(`${name} ditambahkan`);};
    addInp.onkeydown=e=>{if(e.key==="Enter")doAddMember();};
    const addBtn=el("button",{className:"set-save",onclick:doAddMember},"+ Tambah");
    addRow.append(addInp,addBtn);
    wrap.appendChild(addRow);
    wrap.appendChild(el("div",{style:{fontSize:"11px",color:"#9ca3af",marginTop:"6px"}},"Enter atau klik Tambah"));

    const dz=el("div",{className:"danger-zone"});
    dz.appendChild(el("div",{className:"set-lbl",style:{marginBottom:"10px"}},"Danger Zone"));
    const rb=el("button",{className:"reset-btn",onclick:()=>{
      if(window.confirm("Hapus semua data? Tidak bisa dibatalkan!")){
        S.data={};scheduleSave();S.undoStack=[];S.redoStack=[];showToast("Data dihapus");render();
      }
    }});rb.textContent="🗑 Reset Semua Data";dz.appendChild(rb);
    wrap.appendChild(dz);content.appendChild(wrap);
  }

  main.append(topbar,content);
  shell.append(sb,main);
  app.appendChild(shell);
  if(S.toast)app.appendChild(el("div",{className:"toast"},S.toast));

  // Restore search input focus if user was typing
  if(S._searchCursor!=null){
    const inp=document.getElementById("search-inp");
    if(inp){inp.focus();inp.setSelectionRange(S._searchCursor,S._searchCursor);}
    S._searchCursor=null;
  }
}

document.addEventListener("keydown",e=>{
  const a=document.activeElement;
  if(a&&(a.tagName==="TEXTAREA"||a.tagName==="INPUT"))return;
  if((e.ctrlKey||e.metaKey)&&e.key==="z"&&!e.shiftKey){e.preventDefault();undo();}
  if((e.ctrlKey||e.metaKey)&&(e.key==="y"||(e.key==="z"&&e.shiftKey))){e.preventDefault();redo();}
});

// Load from server on startup, with retry in case server not ready yet
async function initialLoad(retriesLeft=5){
  await loadFromServer(true);
  if(S.needLogin){render();return;}
  if(!S.loaded && retriesLeft>0){
    render(); // show "loading" state
    await new Promise(res=>setTimeout(res,800));
    return initialLoad(retriesLeft-1);
  }
  if(!S.loaded)S.loadFailed=true;
  render();
}
initialLoad();
</script>
</body>
